<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Dashboard - Brain Tumor Classifier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style-v2.css">
    <style>
        /* Dashboard-specific styles */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            padding-top: calc(var(--header-height) + 20px);
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
        }

        .dashboard-header p {
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--panel-radius);
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            line-height: 1;
            margin-bottom: 8px;
        }

        .stat-value.success { color: var(--accent-success); }
        .stat-value.danger { color: var(--accent-danger); }
        .stat-value.warning { color: var(--accent-warning); }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .dashboard-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--panel-radius);
            overflow: hidden;
        }

        .dashboard-panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-panel-header h2 {
            font-size: 1rem;
            margin: 0;
        }

        .dashboard-panel-content {
            padding: 20px;
        }

        /* Confusion Matrix */
        .confusion-matrix {
            display: grid;
            gap: 4px;
            font-size: 0.75rem;
        }

        .confusion-cell {
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            min-width: 50px;
        }

        .confusion-header {
            background: var(--bg-elevated);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .confusion-label {
            background: var(--bg-elevated);
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
        }

        .confusion-value {
            background: var(--bg-elevated);
            position: relative;
        }

        .confusion-value.diagonal {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-success);
            font-weight: 600;
        }

        .confusion-value.off-diagonal {
            background: rgba(239, 68, 68, 0.1);
        }

        .confusion-value.high-error {
            background: rgba(239, 68, 68, 0.3);
            color: var(--accent-danger);
            font-weight: 600;
        }

        /* Class Accuracy Bars */
        .class-accuracy-item {
            margin-bottom: 16px;
        }

        .class-accuracy-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.875rem;
        }

        .class-accuracy-bar {
            height: 8px;
            background: var(--bg-elevated);
            border-radius: 4px;
            overflow: hidden;
        }

        .class-accuracy-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Recent Feedback Table */
        .feedback-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8125rem;
        }

        .feedback-table th,
        .feedback-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .feedback-table th {
            background: var(--bg-elevated);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.6875rem;
            letter-spacing: 0.05em;
        }

        .feedback-table tr:hover td {
            background: var(--bg-elevated);
        }

        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.correct {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-success);
        }

        .status-badge.incorrect {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-danger);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-fast);
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-primary);
        }

        .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.875rem;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: var(--text-primary);
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .no-data svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-content">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/>
                    <path d="M12 8v4l2 2"/>
                </svg>
                <h1 class="logo-text">Feedback Dashboard</h1>
            </div>
            <div class="header-right">
                <a href="/" class="dashboard-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Classifier</span>
                </a>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Stats Overview -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalFeedback">-</div>
                <div class="stat-label">Total Feedback</div>
            </div>
            <div class="stat-card">
                <div class="stat-value success" id="correctCount">-</div>
                <div class="stat-label">Correct</div>
            </div>
            <div class="stat-card">
                <div class="stat-value danger" id="incorrectCount">-</div>
                <div class="stat-label">Incorrect</div>
            </div>
            <div class="stat-card">
                <div class="stat-value warning" id="accuracyRate">-</div>
                <div class="stat-label">Accuracy</div>
            </div>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Confusion Matrix -->
            <div class="dashboard-panel">
                <div class="dashboard-panel-header">
                    <h2>Confusion Matrix</h2>
                </div>
                <div class="dashboard-panel-content">
                    <div id="confusionMatrix" class="confusion-matrix">
                        <div class="no-data">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Per-Class Accuracy -->
            <div class="dashboard-panel">
                <div class="dashboard-panel-header">
                    <h2>Accuracy by Class</h2>
                </div>
                <div class="dashboard-panel-content" id="classAccuracy">
                    <div class="no-data">Loading...</div>
                </div>
            </div>

            <!-- Recent Feedback -->
            <div class="dashboard-panel" style="grid-column: span 2;">
                <div class="dashboard-panel-header">
                    <h2>Recent Feedback</h2>
                    <a href="/api/feedback-export" class="btn btn-secondary" download>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Export CSV
                    </a>
                </div>
                <div class="dashboard-panel-content">
                    <table class="feedback-table" id="feedbackTable">
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Predicted</th>
                                <th>True Label</th>
                                <th>Confidence</th>
                                <th>Status</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody id="feedbackTableBody">
                            <tr>
                                <td colspan="6" class="no-data">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CLASSES = ['Glioma', 'Meningioma', 'No Tumor', 'Pituitary'];
        const CLASS_COLORS = {
            'Glioma': '#EF4444',
            'Meningioma': '#F59E0B',
            'No Tumor': '#10B981',
            'Pituitary': '#8B5CF6'
        };

        document.addEventListener('DOMContentLoaded', loadDashboardData);

        async function loadDashboardData() {
            try {
                const response = await fetch('/api/feedback-stats');
                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                    return;
                }

                updateStats(data);
                renderConfusionMatrix(data.confusion_matrix);
                renderClassAccuracy(data.model_accuracy_by_class, data.class_distribution);
                renderRecentFeedback(data.recent_feedback);

            } catch (err) {
                showError('Failed to load dashboard data: ' + err.message);
            }
        }

        function updateStats(data) {
            document.getElementById('totalFeedback').textContent = data.total_feedback;
            document.getElementById('correctCount').textContent = data.correct_predictions;
            document.getElementById('incorrectCount').textContent = data.incorrect_predictions;
            document.getElementById('accuracyRate').textContent =
                data.total_feedback > 0 ? (data.accuracy * 100).toFixed(1) + '%' : 'N/A';
        }

        function renderConfusionMatrix(matrix) {
            const container = document.getElementById('confusionMatrix');

            if (!matrix || Object.keys(matrix).length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <line x1="3" y1="9" x2="21" y2="9"/>
                            <line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                        <p>No feedback data yet</p>
                    </div>
                `;
                return;
            }

            // Create grid: 5 columns (empty + 4 classes), 5 rows (header + 4 classes)
            const numClasses = CLASSES.length;
            container.style.gridTemplateColumns = `100px repeat(${numClasses}, 1fr)`;

            let html = '';

            // Header row
            html += '<div class="confusion-cell confusion-header">True \\ Pred</div>';
            CLASSES.forEach(cls => {
                html += `<div class="confusion-cell confusion-header">${cls.substring(0, 6)}</div>`;
            });

            // Data rows
            CLASSES.forEach((trueClass, i) => {
                html += `<div class="confusion-cell confusion-label">${trueClass}</div>`;
                CLASSES.forEach((predClass, j) => {
                    const value = matrix[trueClass]?.[predClass] || 0;
                    const isDiagonal = i === j;
                    const isHighError = !isDiagonal && value > 2;

                    let cellClass = 'confusion-cell confusion-value';
                    if (isDiagonal) cellClass += ' diagonal';
                    else if (isHighError) cellClass += ' high-error';
                    else if (value > 0) cellClass += ' off-diagonal';

                    html += `<div class="${cellClass}">${value}</div>`;
                });
            });

            container.innerHTML = html;
        }

        function renderClassAccuracy(accuracyByClass, distribution) {
            const container = document.getElementById('classAccuracy');

            if (!accuracyByClass) {
                container.innerHTML = '<div class="no-data">No data available</div>';
                return;
            }

            let html = '';
            CLASSES.forEach(cls => {
                const accuracy = accuracyByClass[cls] || 0;
                const total = distribution[cls]?.total || 0;
                const correct = distribution[cls]?.correct || 0;
                const color = CLASS_COLORS[cls];

                html += `
                    <div class="class-accuracy-item">
                        <div class="class-accuracy-label">
                            <span>${cls}</span>
                            <span>${(accuracy * 100).toFixed(1)}% (${correct}/${total})</span>
                        </div>
                        <div class="class-accuracy-bar">
                            <div class="class-accuracy-fill" style="width: ${accuracy * 100}%; background: ${color};"></div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<div class="no-data">No data available</div>';
        }

        function renderRecentFeedback(feedback) {
            const tbody = document.getElementById('feedbackTableBody');

            if (!feedback || feedback.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="no-data">
                            <p>No feedback submitted yet.</p>
                            <p>Use the classifier and provide feedback to see data here.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = feedback.map(item => `
                <tr>
                    <td>${item.filename || 'Unknown'}</td>
                    <td>${item.predicted}</td>
                    <td>${item.true_label}</td>
                    <td>${(item.confidence * 100).toFixed(1)}%</td>
                    <td>
                        <span class="status-badge ${item.is_correct ? 'correct' : 'incorrect'}">
                            ${item.is_correct ? 'Correct' : 'Wrong'}
                        </span>
                    </td>
                    <td>${formatTimestamp(item.timestamp)}</td>
                </tr>
            `).join('');
        }

        function formatTimestamp(ts) {
            if (!ts) return 'Unknown';
            try {
                const date = new Date(ts);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            } catch {
                return ts;
            }
        }

        function showError(message) {
            console.error(message);
            document.querySelector('.dashboard-container').innerHTML = `
                <div class="error-message">
                    <p>Error loading dashboard: ${message}</p>
                    <a href="/" class="btn btn-secondary" style="margin-top: 16px;">Back to Classifier</a>
                </div>
            `;
        }
    </script>
</body>
</html>
